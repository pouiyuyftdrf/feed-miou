<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feed Miou</title>
<meta name="description" content="Les repas de Miou Miou, partagés entre colocs.">
<meta name="theme-color" content="#8E1C1E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Feed Miou">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Open+Sans:wght@400;600;700&family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=Bagel+Fat+One&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one phone-width column (the mockup's 9:16 screen), header + slot sections, bottom tab bar.
   Three skins, each a complete visual world chosen per feeder; they ignore the host light/dark on purpose. */
:root, [data-skin="velours"] {
  color-scheme: dark;
  --bg-solid: #8E1C1E;
  --bg-img: linear-gradient(180deg, #6C1618 0%, #9C1E20 48%, #D7282A 100%);
  --surface: rgba(255, 224, 216, .2);
  --surface-strong: rgba(255, 224, 216, .32);
  --field-bg: rgba(255, 220, 212, .82);
  --field-ink: #3A0E0E;
  --field-border: #E7B25A;
  --ink: #FFF5EA;
  --ink-soft: rgba(255, 240, 226, .74);
  --accent: #E9B44C;
  --accent-ink: #4A0F10;
  --line: rgba(233, 180, 76, .45);
  --card-border: 1px solid rgba(255, 220, 200, .22);
  --card-shadow: none;
  --btn-shadow: 0 6px 16px -8px rgba(40, 0, 0, .6);
  --radius: 16px;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --display-case: uppercase;
  --display-track: .06em;
  --body: "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ok: #45B85E;
  --ok-ink: #FFFFFF;
  --warn: #FFC94D;
  --warn-ink: #4A0F10;
  --danger: #FFF5EA;
  --danger-ink: #A8171A;
  --sheet: #7C191B;
  --nav: rgba(84, 14, 16, .94);
  --frame: inset 0 0 0 3px #E2A64B;
}
[data-skin="siamois"] {
  color-scheme: light;
  --bg-solid: #F1F3F6;
  --bg-img: none;
  --surface: #FFFFFF;
  --surface-strong: #F7F1EB;
  --field-bg: #F7F2ED;
  --field-ink: #33251E;
  --field-border: #E0D5CB;
  --ink: #33251E;
  --ink-soft: #7A6A61;
  --accent: #3C6EC3;
  --accent-ink: #FFFFFF;
  --line: #E3DCD5;
  --card-border: 1px solid #ECE5DE;
  --card-shadow: 0 1px 2px rgba(51, 37, 30, .05), 0 8px 20px -12px rgba(51, 37, 30, .22);
  --btn-shadow: 0 6px 14px -8px rgba(60, 110, 195, .55);
  --radius: 20px;
  --display: "Fredoka", "Nunito", system-ui, sans-serif;
  --display-case: none;
  --display-track: 0;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ok: #2E9A5A;
  --ok-ink: #FFFFFF;
  --warn: #E28A1C;
  --warn-ink: #FFFFFF;
  --danger: #C8432F;
  --danger-ink: #FFFFFF;
  --sheet: #FFFFFF;
  --nav: rgba(255, 255, 255, .95);
  --frame: 0 0 0 1px #E3DCD5, 0 30px 60px -40px rgba(51, 37, 30, .35);
}
[data-skin="riso"] {
  color-scheme: light;
  --bg-solid: #FFD84A;
  --bg-img: radial-gradient(rgba(30, 39, 104, .09) 1px, transparent 1.2px);
  --surface: #FFF5C9;
  --surface-strong: #FFEC99;
  --field-bg: #FFFBE6;
  --field-ink: #1E2768;
  --field-border: #1E2768;
  --ink: #1E2768;
  --ink-soft: #4A5291;
  --accent: #FF4D8D;
  --accent-ink: #FFFFFF;
  --line: #1E2768;
  --card-border: 2px solid #1E2768;
  --card-shadow: 4px 4px 0 #1E2768;
  --btn-shadow: 3px 3px 0 #1E2768;
  --radius: 10px;
  --display: "Bagel Fat One", "DM Sans", system-ui, sans-serif;
  --display-case: none;
  --display-track: .01em;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ok: #10916A;
  --ok-ink: #FFFFFF;
  --warn: #FF6B1A;
  --warn-ink: #FFFFFF;
  --danger: #E5322D;
  --danger-ink: #FFFFFF;
  --sheet: #FFF5C9;
  --nav: #FFF5C9;
  --frame: 0 0 0 2px #1E2768, 8px 8px 0 #1E2768;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--bg-solid);
  background-image: var(--bg-img);
  background-size: auto, auto;
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
[data-skin="riso"] body { background-size: 14px 14px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.tnum { font-variant-numeric: tabular-nums; }

.app { max-width: 480px; margin: 0 auto; padding-block: 18px 110px; display: flex; flex-direction: column; gap: 22px; }
.app.flow { padding-bottom: 32px; min-height: 100vh; min-height: 100dvh; }
@media (min-width: 620px) {
  .app { margin-block: 28px; border-radius: 30px; box-shadow: var(--frame); padding-inline: 24px; padding-top: 26px; }
  .app.flow { min-height: calc(100dvh - 56px); }
}

.display { font-family: var(--display); text-transform: var(--display-case); letter-spacing: var(--display-track); font-weight: 700; }
[data-skin="siamois"] .display { font-weight: 600; }
[data-skin="riso"] .display { font-weight: 400; }

/* header */
.top { display: flex; flex-direction: column; gap: 4px; text-align: center; }
.top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.cat-chip, .me-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: var(--card-border); box-shadow: var(--card-shadow); border-radius: 999px; padding: 4px 12px 4px 4px; font-weight: 700; }
.me-chip { padding: 4px 4px 4px 12px; }
.cat-chip .cat { width: 32px; height: 34px; }
.top h1 { font-family: var(--body); font-weight: 800; font-size: 26px; line-height: 1.15; }
[data-skin="riso"] .top h1, [data-skin="siamois"] .top h1 { font-family: var(--display); font-weight: 600; }
[data-skin="riso"] .top h1 { font-weight: 400; font-size: 30px; }
.top .date { font-size: 18px; color: var(--ink-soft); }
.top .date::first-letter { text-transform: uppercase; }

.av { --c: #888; display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--c); color: #fff; font-weight: 800; font-size: 13px; flex: none; box-shadow: 0 0 0 2px var(--surface-strong); }
.av.lg { width: 52px; height: 52px; font-size: 20px; }
.av.sm { width: 22px; height: 22px; font-size: 10px; }
[data-skin="riso"] .av { box-shadow: 0 0 0 2px #1E2768; }

.offline { font-size: 12px; text-align: center; color: var(--ink-soft); border: 1px dashed var(--line); border-radius: 12px; padding: 8px 12px; }

/* summary */
.summary { display: flex; align-items: center; gap: 16px; }
.ring { width: 64px; height: 64px; flex: none; }
.ring circle { fill: none; stroke-width: 7; }
.ring .bg { stroke: var(--surface-strong); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .5s; }
.ring text { fill: var(--ink); font-weight: 800; font-size: 15px; text-anchor: middle; dominant-baseline: central; }
.summary strong { display: block; font-size: 17px; }
.summary span { color: var(--ink-soft); font-size: 14px; }

.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--warn); color: var(--warn-ink); font-weight: 600; font-size: 14px; border: 0; text-align: left; width: 100%; }
.alert.danger { background: var(--danger); color: var(--danger-ink); }
[data-skin="riso"] .alert { border: 2px solid #1E2768; }
.alert svg { flex: none; width: 18px; height: 18px; }

/* slots */
.slot { display: flex; flex-direction: column; gap: 10px; }
.slot-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.slot-head h2 { font-family: var(--body); font-weight: 600; font-size: 24px; }
[data-skin="riso"] .slot-head h2, [data-skin="siamois"] .slot-head h2 { font-family: var(--display); }
[data-skin="riso"] .slot-head h2 { font-weight: 400; }
.slot-head .time { color: var(--ink-soft); font-weight: 600; }
.slot-head .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 10px 3px 3px; border-radius: 999px; background: var(--surface); border: var(--card-border); white-space: nowrap; }
.chip.plain { padding: 3px 10px; }
.chip.ok { background: var(--ok); color: var(--ok-ink); border-color: transparent; }
.chip.warn { background: var(--warn); color: var(--warn-ink); border-color: transparent; }
.chip.danger { background: var(--danger); color: var(--danger-ink); border-color: transparent; }
.chip.accent { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
[data-skin="riso"] .chip.ok, [data-skin="riso"] .chip.warn, [data-skin="riso"] .chip.danger, [data-skin="riso"] .chip.accent { border: 2px solid #1E2768; }

.items { display: flex; flex-wrap: wrap; gap: 12px; }
.item { position: relative; width: 104px; min-height: 112px; padding: 8px 6px 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 2px; text-align: center; background: var(--surface); border: var(--card-border); box-shadow: var(--card-shadow); border-radius: var(--radius); color: var(--ink); font-size: 13px; line-height: 1.2; transition: transform .15s; }
.item:hover { transform: translateY(-2px); }
.item .ty { font-weight: 600; }
.item .ic { width: 42px; height: 42px; }
.item .qty { color: var(--ink-soft); }
.item.done { background: var(--surface-strong); }
.item .check { width: 42px; height: 42px; animation: pop .35s ease-out; }
.item .by { font-size: 12px; font-weight: 600; }
.item.add { justify-content: center; font-size: 40px; font-weight: 300; color: var(--ink); border-style: dashed; }
.item .x { position: absolute; top: 2px; right: 4px; width: 26px; height: 26px; border: 0; background: none; font-size: 18px; line-height: 1; color: var(--ink); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.section { display: flex; flex-direction: column; gap: 12px; }
.section > h2 { font-size: 20px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 20px; }
.muted { color: var(--ink-soft); }
.small { font-size: 13px; }
.card { background: var(--surface); border: var(--card-border); box-shadow: var(--card-shadow); border-radius: var(--radius); padding: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.row .grow { flex: 1; min-width: 0; }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }
.list .li { display: flex; align-items: center; gap: 12px; padding: 11px 2px; }
.li .grow { flex: 1; min-width: 0; }
.li .t { font-weight: 700; }
.li .s { font-size: 13px; color: var(--ink-soft); }
.empty { text-align: center; color: var(--ink-soft); padding: 18px 8px; font-size: 14px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; border-radius: 999px; padding: 10px 16px; border: var(--card-border); background: var(--surface); color: var(--ink); box-shadow: var(--card-shadow); text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: var(--btn-shadow); }
[data-skin="riso"] .btn.primary { border: 2px solid #1E2768; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn.danger { color: var(--danger-ink); background: var(--danger); border-color: transparent; }
.btn svg { width: 18px; height: 18px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }

/* bottom nav */
.nav { position: fixed; z-index: 20; bottom: 0; left: 50%; transform: translateX(-50%); width: min(480px, 100%); display: grid; grid-template-columns: repeat(5, 1fr); background: var(--nav); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
@media (min-width: 620px) { .nav { bottom: 14px; border-radius: 20px; border: var(--card-border); box-shadow: var(--card-shadow); width: min(440px, 100%); } }
[data-skin="riso"] .nav { border-top: 2px solid #1E2768; }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 700; color: var(--ink-soft); border-radius: 12px; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--ink); background: var(--surface-strong); }
[data-skin="velours"] .nav button[aria-current="page"] { color: var(--accent); background: transparent; }

/* sheets */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(10, 4, 4, .45); z-index: 40; animation: fade .2s; }
.sheet { position: fixed; z-index: 41; left: 50%; bottom: 0; transform: translateX(-50%); width: min(480px, 100%); max-height: 88vh; overflow: auto; background: var(--sheet); color: var(--ink); border-radius: 24px 24px 0 0; padding: 20px max(18px, env(safe-area-inset-left, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -10px 40px rgba(0,0,0,.25); animation: up .25s ease-out; }
[data-skin="velours"] .sheet { box-shadow: inset 0 3px 0 #E2A64B, 0 -10px 40px rgba(0,0,0,.35); }
[data-skin="riso"] .sheet { border: 2px solid #1E2768; border-bottom: 0; box-shadow: none; }
@media (min-width: 620px) { .sheet { bottom: 50%; transform: translate(-50%, 50%); border-radius: 24px; animation: fade .2s; } [data-skin="riso"] .sheet { border-bottom: 2px solid #1E2768; box-shadow: 6px 6px 0 #1E2768; } }
.sheet h2 { font-size: 22px; text-align: center; }
.sheet .sub { text-align: center; color: var(--ink-soft); margin-top: -8px; }
@keyframes up { from { transform: translate(-50%, 30px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

.who-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; }
.who { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px; background: var(--surface); border: var(--card-border); box-shadow: var(--card-shadow); border-radius: var(--radius); font-weight: 700; color: var(--ink); }
.who.me { outline: 3px solid var(--accent); outline-offset: -3px; }
.who .tag { font-size: 11px; color: var(--ink-soft); font-weight: 600; margin-top: -6px; }

/* fields */
.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span, .field > legend { font-size: 13px; font-weight: 700; color: var(--ink-soft); padding: 0; }
.field input, .field select, .field textarea { width: 100%; background: var(--field-bg); color: var(--field-ink); border: 1.5px solid var(--field-border); border-radius: 12px; padding: 12px 14px; }
[data-skin="riso"] .field input, [data-skin="riso"] .field select, [data-skin="riso"] .field textarea { border-width: 2px; }
.field input::placeholder, .field textarea::placeholder { color: color-mix(in srgb, var(--field-ink) 50%, transparent); }
fieldset.field { border: 0; margin: 0; padding: 0; min-width: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { position: relative; }
.pill input { position: absolute; opacity: 0; inset: 0; }
.pill span { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: var(--surface); border: var(--card-border); font-weight: 600; font-size: 14px; }
.pill input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.pill input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.pill .ic { width: 22px; height: 22px; }
.coats { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
.coat { position: relative; }
.coat input { position: absolute; opacity: 0; inset: 0; }
.coat span { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border-radius: 14px; background: var(--surface); border: var(--card-border); font-size: 12px; font-weight: 600; }
.coat .cat { width: 44px; height: 48px; }
.coat input:checked + span { outline: 3px solid var(--accent); outline-offset: -3px; background: var(--surface-strong); }
.coat input:focus-visible + span { outline: 3px solid var(--accent); }

/* onboarding (mockup screens) */
.flow-screen { flex: 1; display: flex; flex-direction: column; gap: 22px; }
.flow-screen.center { justify-content: center; align-items: center; text-align: center; }
.flow-title { font-family: var(--body); font-weight: 800; font-size: clamp(28px, 7vw, 36px); line-height: 1.12; text-align: center; }
[data-skin="riso"] .flow-title, [data-skin="siamois"] .flow-title { font-family: var(--display); font-weight: 600; }
[data-skin="riso"] .flow-title { font-weight: 400; }
.flow-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.cta { display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; font-weight: 800; font-size: 22px; color: var(--ink); padding: 8px 4px; }
.cta svg { width: 34px; height: 34px; fill: currentColor; }
[data-skin="riso"] .cta, [data-skin="siamois"] .cta { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 10px 20px 10px 14px; box-shadow: var(--btn-shadow); font-size: 18px; }
[data-skin="riso"] .cta { border: 2px solid #1E2768; }
[data-skin="riso"] .cta svg, [data-skin="siamois"] .cta svg { width: 26px; height: 26px; }
.back { background: none; border: 0; color: var(--ink-soft); font-weight: 700; padding: 8px 0; }
.brand { font-size: clamp(44px, 13vw, 64px); line-height: 1.02; color: var(--accent); }
[data-skin="velours"] .brand { background: linear-gradient(180deg, #F2CF72, #C9922E); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-cat { width: min(62vw, 230px); height: auto; }
.splash { background: none; border: 0; color: inherit; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.plus-big { width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; background: #FFFFFF; color: #111; font-size: 72px; font-weight: 600; line-height: 1; border: 0; box-shadow: 0 0 0 7px var(--accent), 0 10px 26px -10px rgba(0,0,0,.5); }
[data-skin="riso"] .plus-big { box-shadow: 0 0 0 4px #1E2768, 6px 6px 0 4px #1E2768; background: var(--accent); color: #fff; }
.paws { width: 140px; height: 150px; align-self: flex-end; margin-right: 6%; color: var(--ink); opacity: .9; }
.welcome { font-size: clamp(40px, 12vw, 58px); color: var(--ink); }
[data-skin="velours"] .welcome { font-family: "Cinzel", serif; color: #FFF5EA; text-shadow: 0 0 0 #fff, 3px 3px 0 #6C1618, -1px -1px 0 #E9B44C; }
.catname { font-size: clamp(30px, 9vw, 44px); color: var(--accent); }
.feeder-tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; min-height: 120px; padding: 14px 8px; background: var(--surface); border: var(--card-border); box-shadow: var(--card-shadow); border-radius: var(--radius); font-weight: 700; }
.feeder-tile input { width: 100%; text-align: center; background: transparent; border: 0; border-bottom: 1.5px dashed var(--line); padding: 4px; font-weight: 700; color: var(--ink); }
.feeder-tile .x { position: absolute; top: 4px; right: 6px; background: none; border: 0; font-size: 18px; color: var(--ink); width: 28px; height: 28px; }
.feeder-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.feeder-tile.add { justify-content: center; font-size: 44px; font-weight: 300; color: var(--ink); }

/* skins picker */
.skins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 380px) { .skins { grid-template-columns: 1fr; } }
.skin-card { display: flex; flex-direction: column; gap: 0; padding: 0; overflow: hidden; border-radius: 16px; border: 0; background: none; text-align: left; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
.skin-card[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent), 0 0 0 5px var(--bg-solid); }
.skin-card .pv { background-color: var(--bg-solid); background-image: var(--bg-img); background-size: 10px 10px; color: var(--ink); padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 104px; }
.skin-card .pv[data-skin="velours"] { background-size: auto; box-shadow: inset 0 0 0 2px #E2A64B; }
.skin-card .pv .cat { width: 44px; height: 48px; }
.skin-card .pv .nm { font-family: var(--display); text-transform: var(--display-case); letter-spacing: var(--display-track); font-size: 15px; line-height: 1; }
.skin-card .pv .mini { display: flex; gap: 4px; }
.skin-card .pv .mini i { width: 18px; height: 12px; border-radius: 4px; background: var(--surface); border: var(--card-border); }
.skin-card .pv .mini i:first-child { background: var(--accent); border-color: transparent; }
.skin-card .meta { background: var(--sheet); color: var(--ink); padding: 8px 10px; font-size: 12px; line-height: 1.3; }
.skin-card .meta b { display: block; font-size: 13px; }

/* planning */
.rota-wrap { overflow-x: auto; }
.rota { width: 100%; border-collapse: separate; border-spacing: 4px; min-width: 320px; }
.rota th { font-size: 12px; font-weight: 700; color: var(--ink-soft); padding: 2px; }
.rota th.today { color: var(--ink); }
.rota th.today span { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 7px; }
.rota td { padding: 0; }
.rota td button { width: 100%; aspect-ratio: 1; max-width: 48px; display: grid; place-items: center; background: var(--surface); border: var(--card-border); border-radius: 12px; padding: 0; color: var(--ink-soft); }
.rota td.today button { background: var(--surface-strong); }
.rota .rl { font-size: 12px; font-weight: 700; text-align: left; padding-right: 4px; white-space: nowrap; }
.hist { display: grid; grid-template-columns: auto repeat(3, 1fr); gap: 6px 8px; align-items: center; font-size: 13px; }
.hist .hd { font-weight: 700; color: var(--ink-soft); font-size: 12px; }
.hist .day { font-weight: 700; white-space: nowrap; }
.hist .cell { display: flex; gap: 3px; align-items: center; min-height: 26px; flex-wrap: wrap; }
.miss { width: 22px; height: 22px; border-radius: 50%; border: 2px dashed var(--ink-soft); opacity: .6; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 70px 1fr 64px; gap: 10px; align-items: center; font-size: 14px; }
.bar-row .track { height: 14px; background: var(--surface-strong); border-radius: 999px; overflow: hidden; }
.bar-row .fill { height: 100%; border-radius: 999px; background: var(--c); }
.bar-row .n { text-align: right; font-weight: 700; }

/* stock */
.stock-card { display: flex; flex-direction: column; gap: 10px; }
.stock-top { display: flex; gap: 12px; align-items: center; }
.stock-top .ic { width: 40px; height: 40px; flex: none; }
.meter { height: 10px; border-radius: 999px; background: var(--surface-strong); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.meter.warn i { background: var(--warn); }
.meter.danger i { background: var(--danger); }
[data-skin="velours"] .meter.danger i { background: #FFF5EA; }
.big { font-size: 22px; font-weight: 800; }

/* santé */
.spark { width: 100%; height: 80px; display: block; }
.spark .area { fill: var(--accent); opacity: .18; }
.spark .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.spark .grid { stroke: var(--line); stroke-width: 1; }
.spark .dot { fill: var(--accent); stroke: var(--sheet); stroke-width: 2; }
.spark text { fill: var(--ink-soft); font-size: 11px; }

/* coloc */
.balance { display: flex; flex-wrap: wrap; gap: 8px; }
.bal { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--surface); border: var(--card-border); font-weight: 700; font-size: 14px; }
.bal .pos { color: var(--ok); }
[data-skin="velours"] .bal .pos { color: #9BF0AE; }
.bal .neg { color: var(--danger); }
[data-skin="velours"] .bal .neg { color: #FFD9A0; }

.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg-solid); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.has-action.show { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 6px 6px 6px 16px; }
.toast button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 7px 14px; font-weight: 800; }
.loading { min-height: 70vh; display: grid; place-items: center; text-align: center; gap: 12px; }

/* Miou Miou's photo avatar */
.cat-photo { display: block; border-radius: 50%; object-fit: cover; object-position: 50% 42%; background: var(--surface-strong); flex: none; }
.cat-chip .cat-photo { width: 32px; height: 32px; }
.who-hero { display: grid; place-items: center; }
.who-hero .cat-photo, .who-hero .cat { width: 132px; height: 132px; }
.who-hero .cat-photo { box-shadow: 0 0 0 5px var(--accent); }
.wiggle { animation: wiggle .5s ease-in-out; }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-9deg); } 60% { transform: rotate(7deg); } }

/* mood + next meal */
.mood { display: flex; align-items: center; gap: 20px; }
.mood-av { position: relative; flex: none; background: none; border: 0; padding: 0; border-radius: 50%; --ring: var(--accent); margin: 4px; }
.mood-av[data-s="done"] { --ring: var(--ok); }
.mood-av[data-s="late"] { --ring: var(--danger); }
.mood-av[data-s="now"] { --ring: var(--warn); }
.mood-av .cat-photo, .mood-av .cat { width: 84px; height: 84px; }
.mood-av::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 4px solid var(--ring); }
.mood-av[data-s="late"]::after { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.07); opacity: .55; } }
.mood-txt { display: flex; flex-direction: column; gap: 10px; min-width: 0; flex: 1; }
.bubble { position: relative; background: var(--surface-strong); border-radius: 16px; padding: 10px 14px; font-weight: 700; font-size: 15px; line-height: 1.3; }
.bubble::before { content: ""; position: absolute; left: -8px; top: 50%; margin-top: -8px; border: 8px solid transparent; border-left: 0; border-right-color: var(--surface-strong); }
.dots { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.dots i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--ink-soft); opacity: .7; }
.dots i.on { background: var(--accent); border-color: var(--accent); opacity: 1; }
.next { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.next-txt { flex: 1 1 210px; display: flex; flex-direction: column; gap: 7px; align-items: flex-start; min-width: 0; }
.next-txt strong { font-size: 17px; line-height: 1.3; }
.next-txt strong .muted { font-weight: 600; }
.btn.go { padding: 14px 20px; font-size: 16px; flex: 1 1 auto; }
.btn.go svg { width: 22px; height: 22px; fill: currentColor; }
.hint { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--ink-soft); padding: 4px 2px; }
.hint > svg { width: 22px; height: 22px; fill: currentColor; flex: none; }
.hint span { flex: 1; }

/* header controls, sheets, toggles */
.top-right { display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; background: var(--surface); border: var(--card-border); box-shadow: var(--card-shadow); color: var(--ink); padding: 0; }
.icon-btn svg { width: 20px; height: 20px; }
.sheet-x { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: var(--card-border); background: var(--surface); color: var(--ink); font-size: 22px; line-height: 1; display: grid; place-items: center; padding: 0; }
.grip { width: 42px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; margin: -8px 0 -6px; flex: none; }
@media (min-width: 620px) { .grip { display: none; } }
.sheet h2 { padding-inline: 40px; }
.sheet .label { font-weight: 700; font-size: 13px; color: var(--ink-soft); margin-bottom: -6px; }
.sheet-hero { display: grid; place-items: center; }
.sheet-hero .cat-photo, .sheet-hero .cat { width: 112px; height: 112px; }
.sheet-hero .cat-photo { box-shadow: 0 0 0 4px var(--accent); }
.switch { width: 48px; height: 28px; border-radius: 999px; background: var(--surface-strong); border: var(--card-border); position: relative; padding: 0; flex: none; }
.switch::after { content: ""; position: absolute; top: 50%; left: 4px; width: 20px; height: 20px; margin-top: -10px; border-radius: 50%; background: var(--ink-soft); transition: transform .2s; }
.switch[aria-pressed="true"] { background: var(--accent); }
.switch[aria-pressed="true"]::after { transform: translateX(18px); background: var(--accent-ink); }
.steps { display: flex; gap: 6px; justify-content: center; }
.steps i { width: 8px; height: 8px; border-radius: 4px; background: var(--ink-soft); opacity: .35; transition: width .2s; }
.steps i.past { opacity: .7; }
.steps i.on { width: 24px; background: var(--accent); opacity: 1; }
.rota td button.mine { outline: 2px solid var(--accent); outline-offset: -2px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);

const pad = (n) => String(n).padStart(2, "0");
const dateKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dow = (d) => (d.getDay() + 6) % 7;
const toMin = (t) => { const [h, m] = String(t || "00:00").split(":").map(Number); return h * 60 + (m || 0); };
const hFmt = (ms) => { const d = new Date(ms); return d.getMinutes() ? `${d.getHours()}h${pad(d.getMinutes())}` : `${d.getHours()}h`; };
const tFmt = (t) => { const m = toMin(t); return m % 60 ? `${Math.floor(m / 60)}h${pad(m % 60)}` : `${Math.floor(m / 60)}h`; };
const longDate = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const shortDate = new Intl.DateTimeFormat("fr-FR", { weekday: "short", day: "numeric" });
const dayMonth = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short" });
const eur = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
const num = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 2 });
const daysBetween = (a, b) => Math.round((fromKey(b) - fromKey(a)) / 864e5);

function toast(msg, action) {
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ""}`;
  t.classList.toggle("has-action", !!action);
  if (action) t.querySelector("button").onclick = () => { action.fn(); t.classList.remove("show"); };
  t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), action ? 5000 : 2600);
}

/* ---------- sounds: tiny synthesized meows, crunches and purrs (no audio files) ---------- */
const Sound = (() => {
  let ctx = null, master = null, noise = null, on = true;
  try { on = localStorage.getItem("feedmiou.sound") !== "off"; } catch (e) {}
  function ac() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      ctx = new C(); master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination);
      noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  const rnd = (a, b) => a + Math.random() * (b - a);
  function env(param, t, peak, a, d) { param.setValueAtTime(0.0001, t); param.exponentialRampToValueAtTime(peak, t + a); param.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function tone(c, { f, to, t = 0, dur = 0.1, type = "sine", vol = 0.1 }) {
    const s = c.currentTime + 0.005 + t, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, s); if (to) o.frequency.exponentialRampToValueAtTime(to, s + dur);
    env(g.gain, s, vol, Math.min(0.012, dur / 4), dur); o.connect(g); g.connect(master); o.start(s); o.stop(s + dur + 0.05);
  }
  function burst(c, { t = 0, f = 2500, q = 1, dur = 0.05, vol = 0.3 }) {
    const s = c.currentTime + 0.005 + t, src = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();
    src.buffer = noise; bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q;
    env(g.gain, s, vol, 0.003, dur); src.connect(bp); bp.connect(g); g.connect(master);
    src.start(s, Math.random() * 0.5); src.stop(s + dur + 0.05);
  }
  const FX = {
    tap: (c) => tone(c, { f: 740, to: 1040, dur: 0.06, type: "triangle", vol: 0.07 }),
    pop: (c) => tone(c, { f: 420, to: 820, dur: 0.08, vol: 0.09 }),
    undo: (c) => tone(c, { f: 640, to: 300, dur: 0.18, type: "triangle", vol: 0.1 }),
    blop: (c) => { tone(c, { f: 240, to: 900, dur: 0.1, vol: 0.16 }); tone(c, { f: 300, to: 1100, t: 0.12, dur: 0.08, vol: 0.1 }); },
    crunch: (c) => { [0, 0.09, 0.2, 0.27].forEach((t) => burst(c, { t: t + rnd(0, 0.02), f: rnd(1800, 3800), q: 0.9, dur: rnd(0.03, 0.06), vol: 0.38 })); },
    coin: (c) => { tone(c, { f: 1318, dur: 0.08, type: "square", vol: 0.04 }); tone(c, { f: 1760, t: 0.08, dur: 0.22, type: "square", vol: 0.04 }); },
    sparkle: (c) => { [1047, 1319, 1568, 2093].forEach((f, i) => tone(c, { f, t: i * 0.06, dur: 0.22, vol: 0.06 })); },
    trill: (c) => {
      const s = c.currentTime + 0.005, d = 0.28, k = rnd(0.92, 1.12);
      const o = c.createOscillator(), am = c.createGain(), lfo = c.createOscillator(), lg = c.createGain(), lp = c.createBiquadFilter(), g = c.createGain();
      o.type = "triangle"; o.frequency.setValueAtTime(380 * k, s); o.frequency.exponentialRampToValueAtTime(620 * k, s + d);
      lfo.frequency.value = 32; lg.gain.value = 0.5; am.gain.value = 0.5; lfo.connect(lg); lg.connect(am.gain);
      lp.type = "lowpass"; lp.frequency.value = 2000; env(g.gain, s, 0.35, 0.03, d);
      o.connect(am); am.connect(lp); lp.connect(g); g.connect(master);
      o.start(s); lfo.start(s); o.stop(s + d + 0.05); lfo.stop(s + d + 0.05);
    },
    meow: (c) => {
      const s = c.currentTime + 0.005, d = rnd(0.5, 0.65), k = rnd(0.9, 1.15);
      const o = c.createOscillator(); o.type = "sawtooth";
      o.frequency.setValueAtTime(480 * k, s);
      o.frequency.linearRampToValueAtTime(760 * k, s + d * 0.3);
      o.frequency.linearRampToValueAtTime(680 * k, s + d * 0.6);
      o.frequency.linearRampToValueAtTime(420 * k, s + d);
      const vib = c.createOscillator(), vg = c.createGain(); vib.frequency.value = 6.5; vg.gain.value = 10 * k; vib.connect(vg); vg.connect(o.frequency);
      const f1 = c.createBiquadFilter(); f1.type = "bandpass"; f1.Q.value = 5;
      f1.frequency.setValueAtTime(800, s); f1.frequency.linearRampToValueAtTime(1500, s + d * 0.35); f1.frequency.linearRampToValueAtTime(650, s + d);
      const f2 = c.createBiquadFilter(); f2.type = "bandpass"; f2.Q.value = 7;
      f2.frequency.setValueAtTime(2700, s); f2.frequency.linearRampToValueAtTime(2300, s + d * 0.35); f2.frequency.linearRampToValueAtTime(1100, s + d);
      const g = c.createGain(), g2 = c.createGain(); g2.gain.value = 0.6;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(1.1, s + 0.07); g.gain.setValueAtTime(1.1, s + d * 0.55); g.gain.exponentialRampToValueAtTime(0.0001, s + d);
      o.connect(f1); o.connect(f2); f1.connect(g); f2.connect(g2); g2.connect(g); g.connect(master);
      o.start(s); vib.start(s); o.stop(s + d + 0.05); vib.stop(s + d + 0.05);
    },
    purr: (c) => {
      const s = c.currentTime + 0.005, d = 1.3;
      const src = c.createBufferSource(); src.buffer = noise; src.loop = true;
      const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 320; lp.Q.value = 2;
      const am = c.createGain(); am.gain.value = 0.5;
      const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 24; lg.gain.value = 0.5; lfo.connect(lg); lg.connect(am.gain);
      const g = c.createGain(); g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.9, s + 0.2); g.gain.setValueAtTime(0.9, s + d - 0.35); g.gain.exponentialRampToValueAtTime(0.0001, s + d);
      src.connect(lp); lp.connect(am); am.connect(g); g.connect(master);
      src.start(s); lfo.start(s); src.stop(s + d + 0.05); lfo.stop(s + d + 0.05);
    }
  };
  return {
    get on() { return on; },
    toggle() { on = !on; try { localStorage.setItem("feedmiou.sound", on ? "on" : "off"); } catch (e) {} return on; },
    play(name, delay = 0) {
      if (!on) return;
      const run = () => { try { const c = ac(); if (c && FX[name]) FX[name](c); } catch (e) {} };
      if (delay) setTimeout(run, delay); else run();
    }
  };
})();

/* ---------- storage: shared db when the viewer serves it, this device otherwise ---------- */
const Store = (() => {
  let db = null, sb = null, chan = null, code = "", mode = "local";
  const LS = "feedmiou.data.v1", LS_CACHE = "feedmiou.sbcache.v1", LS_CODE = "feedmiou.code";
  let mem = {};
  const docL = new Map(), colL = new Map(), queues = new Map(), cache = new Map(), wheres = new Map();
  const colOf = (p) => p.split("/").slice(0, -1).join("/");
  const idOf = (p) => p.split("/").pop();
  const cmp = (a, op, b) => op === ">=" ? a >= b : op === "<=" ? a <= b : op === "==" ? a === b : true;
  function load() { try { mem = JSON.parse(localStorage.getItem(LS) || "{}") || {}; } catch (e) { mem = {}; } }
  function save() { try { localStorage.setItem(LS, JSON.stringify(mem)); } catch (e) {} }
  function colData(c, f) { const o = {}; for (const p in mem) if (colOf(p) === c && (!f || f(mem[p]))) o[idOf(p)] = mem[p]; return o; }
  function emit(path) {
    (docL.get(path) || []).forEach((cb) => cb(mem[path] ?? null));
    const c = colOf(path); (colL.get(c) || []).forEach((l) => l.cb(colData(c, l.f)));
  }
  function enqueue(path, fn) {
    const next = (queues.get(path) || Promise.resolve()).catch(() => {}).then(fn);
    queues.set(path, next); return next;
  }
  function onErr(e) {
    if (e && (e.code === "invalid_argument" || e.code === "42501")) toast("Enregistrement refusé : le code de la coloc n'est plus valide.");
    else if (e && e.code === "quota_exceeded") toast("La base est pleine : supprime d'anciens éléments.");
    else if (!navigator.onLine || (e && /fetch|network|load failed/i.test(e.message || ""))) toast("Pas de connexion : la modification n'a pas été enregistrée.");
    else toast("Impossible d'enregistrer pour l'instant. Réessaie dans un moment.");
  }
  /* Supabase mode: one row per document in feedmiou_docs, a cache kept on the device for instant start */
  function pick(docs, f) { if (!f) return { ...docs }; const o = {}; for (const k in docs) if (f(docs[k])) o[k] = docs[k]; return o; }
  function sbNotify(col) {
    const docs = cache.get(col); if (!docs) return;
    (colL.get(col) || []).forEach((l) => l.cb(pick(docs, l.f)));
    for (const [path, cbs] of docL) if (colOf(path) === col) cbs.forEach((cb) => cb(docs[idOf(path)] ?? null));
  }
  function persist() { try { localStorage.setItem(LS_CACHE, JSON.stringify(Object.fromEntries(cache))); } catch (e) {} }
  async function sbFetch(col) {
    if (!sb) return;
    let q = sb.from("feedmiou_docs").select("path,data").eq("col", col);

      <button class="cat-chip" data-act="edit-cat" aria-label="Profil de ${esc(cat.name)}">${catAvatar()}<span>${esc(cat.name || "Mon chat")}</span></button>
      <div class="top-right">
        <button class="icon-btn" data-act="toggle-sound" aria-pressed="${Sound.on}" aria-label="${Sound.on ? "Couper les sons" : "Activer les sons"}">${Sound.on ? ICONS.sound : ICONS.mute}</button>
        <button class="me-chip" data-act="switch-me" aria-label="Changer d'utilisateur"><span class="small">${esc(m ? m.name : "")}</span>${av(m)}</button>
      </div>
    </div>
    <h1>${esc(title)}</h1>
    <p class="date">${esc(longDate.format(new Date()))}</p>

}
function nav() {
  return `<nav class="nav" aria-label="Sections">${TABS.map((t) => `<button data-act="tab" data-k="${t.k}" ${state.tab === t.k && !state.sub ? 'aria-current="page"' : ""}>${ICONS[t.k]}<span>${t.label}</span></button>`).join("")}</nav>`;
}

/* --- today --- */
function renderToday() {
  const now = new Date(), key = dateKey(now), cat = state.config.cat || {};
  let total = 0, done = 0, next = null;
  for (const sl of SLOTS) {
    const its = slotItems(sl.k); total += its.length;
    const d = its.filter((it) => feedFor(key, it.id)).length; done += d;
    if (!next && d < its.length) next = sl;
  }
  const st = next ? slotStatus(next.k, now) : null;
  const OF = { matin: "du matin", midi: "du midi", soir: "du soir" };
  const mood = !total ? { s: "later", say: "Miaou ? Ajoute mes repas dans Coloc › Repas & horaires." }
    : !next ? { s: "done", say: "Miam, merci ! J'ai tout eu aujourd'hui." }
    : st.s === "late" ? { s: "late", say: `J'ai faim ! Le repas ${OF[next.k]} est en retard.` }
    : st.s === "now" ? { s: "now", say: `À table ! C'est le repas ${OF[next.k]}.` }
    : { s: "later", say: done ? `Je digère. Prochain repas à ${tFmt(slotTime(next.k))}.` : `Je fais la sieste jusqu'à ${tFmt(slotTime(next.k))}.` };
  const dots = Array.from({ length: total }, (_, i) => `<i class="${i < done ? "on" : ""}"></i>`).join("");

  let nextCard = "";
  if (next) {
    const rem = slotItems(next.k).filter((it) => !feedFor(key, it.id)), g = feeder(rotaFor(now, next.k));
    const eyebrow = st.s === "late" ? "En retard" : st.s === "now" ? "C'est l'heure" : "Prochain repas";
    nextCard = `<section class="card next" aria-label="${eyebrow}">
      <div class="next-txt"><span class="chip plain ${st.s === "late" ? "danger" : st.s === "now" ? "warn" : ""}">${eyebrow} · ${next.label} ${tFmt(slotTime(next.k))}</span>
        <strong>${rem.map((it) => `${esc(TYPES[it.type] || it.type)} <span class="muted">${esc(it.qty)}</span>`).join(" + ")}</strong>
        ${g ? `<span class="row small">${av(g, "sm")}${g.id === state.me ? "Tu es de garde" : `${esc(g.name)} est de garde`}</span>` : ""}</div>
      <button class="btn primary go" data-act="do-feed-all" data-slot="${next.k}">${PAW}<span>${rem.length > 1 ? "J'ai tout donné" : "C'est donné"}</span></button>
    </section>`;
  }

  const alerts = [];
  for (const id of Object.keys(state.stock)) { const s = stockInfo(id); if (s && s.level !== "ok") alerts.push(`<button class="alert ${s.level === "danger" ? "danger" : ""}" data-act="tab" data-k="stock">${ICONS.box}<span>${esc(s.name)} : ${s.daysLeft != null ? `environ ${Math.floor(s.daysLeft)} j restants` : "stock épuisé"}</span></button>`); }
  for (const r of reminders()) if (r.delta <= 3) alerts.push(`<button class="alert ${r.delta < 0 ? "danger" : ""}" data-act="tab" data-k="sante">${ICONS.bell}<span>${esc(r.label)} : ${r.delta < 0 ? `en retard de ${-r.delta} j` : r.delta === 0 ? "aujourd'hui" : `dans ${r.delta} j`}</span></button>`);

  const hint = total && !seenHint() ? `<p class="hint">${PAW}<span>Touchez une portion dès qu'elle est servie. Touchez-la à nouveau pour annuler ou changer qui l'a donnée.</span><button class="btn ghost small" data-act="dismiss-hint" aria-label="Masquer l'astuce">×</button></p>` : "";
  const notes = Object.entries(state.notes).filter(([, n]) => n.date === key).sort((a, b) => a[1].at - b[1].at);
  return `
  <section class="card mood" aria-label="Humeur de ${esc(cat.name)}">
    <button class="mood-av" data-act="pet" data-s="${mood.s}" aria-label="Caresser ${esc(cat.name)}">${catAvatar()}</button>
    <div class="mood-txt"><p class="bubble">${mood.say}</p>
      ${total ? `<div class="row small"><span class="dots" aria-hidden="true">${dots}</span><span class="tnum muted">${done} portion${done > 1 ? "s" : ""} sur ${total}</span></div>` : ""}</div>
  </section>
  ${nextCard}
  ${alerts.length ? `<div class="alerts">${alerts.join("")}</div>` : ""}
  ${hint}
  ${SLOTS.map((sl) => renderSlot(sl, now)).join("")}
  <section class="section">
    <div class="section-head"><h2>Notes du jour</h2><button class="btn small" data-act="add-note">${ICONS.plus}Ajouter</button></div>
    ${notes.length ? `<div class="card list">${notes.map(([id, n]) => `<div class="li">${av(feeder(n.by), "sm")}<div class="grow"><div>${esc(n.text)}</div><div class="s">${hFmt(n.at)} · ${esc((feeder(n.by) || {}).name || "")}${n.kind === "sante" ? " · santé" : ""}</div></div><button class="btn ghost small" data-act="del-note" data-id="${id}" aria-label="Supprimer la note">×</button></div>`).join("")}</div>`
      : `<p class="empty card">Rien à signaler. Une gamelle boudée, un vomi, un câlin record ? Note-le ici pour les autres.</p>`}
  </section>`;
}
function renderSlot(sl, now) {
  const items = slotItems(sl.k); if (!items.length) return "";
  const key = dateKey(now), st = slotStatus(sl.k, now), g = feeder(rotaFor(now, sl.k));
  const chip = st.s === "done" ? `<span class="chip plain ok">Fait</span>` : st.s === "late" ? `<span class="chip plain danger">En retard</span>` : st.s === "now" ? `<span class="chip plain warn">C'est l'heure</span>` : `<span class="chip plain">À ${tFmt(slotTime(sl.k))}</span>`;
  return `<section class="slot" id="slot-${sl.k}">
    <div class="slot-head"><h2>${sl.label}</h2><span class="time tnum">${tFmt(slotTime(sl.k))}</span><span class="spacer"></span>${g ? `<span class="chip">${av(g, "sm")}${esc(g.name)} de garde</span>` : ""}${chip}</div>
    <div class="items">${items.map((it) => {
      const f = feedFor(key, it.id);
      if (f) { const by = feeder(f.by); return `<button class="item done" data-act="feed" data-slot="${sl.k}" data-id="${it.id}" aria-label="${esc(TYPES[it.type])} donné par ${esc(by ? by.name : "")}">${CHECK}<span class="by">Distribué à ${hFmt(f.at)}<br>par ${esc(by ? by.name : "?")}</span></button>`; }
      return `<button class="item" data-act="feed" data-slot="${sl.k}" data-id="${it.id}"><span class="ty">${esc(TYPES[it.type] || it.type)}</span>${foodSVG(it.type)}<span class="qty">${esc(it.qty)}${it.time ? ` · ${tFmt(it.time)}` : ""}</span></button>`;
    }).join("")}</div>
  </section>`;
}

/* --- planning --- */
function renderPlanning() {
  const fl = feederList(), today = new Date(), td = dow(today);
  const days = ["L", "M", "M", "J", "V", "S", "D"];
  const rota = `<table class="rota"><thead><tr><th></th>${days.map((d, i) => `<th class="${i === td ? "today" : ""}"><span>${d}</span></th>`).join("")}</tr></thead><tbody>${SLOTS.map((sl) => `<tr><th class="rl" scope="row">${sl.label}</th>${days.map((d, i) => {
    const f = feeder((state.config.rota || {})[`${i}-${sl.k}`]);
    return `<td class="${i === td ? "today" : ""}"><button class="${f && f.id === state.me ? "mine" : ""}" data-act="rota" data-cell="${i}-${sl.k}" aria-label="${sl.label}, ${["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"][i]} : ${f ? esc(f.name) : "personne"}">${f ? av(f, "sm") : "–"}</button></td>`;
  }).join("")}</tr>`).join("")}</tbody></table>`;

  const rows = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(today, -i), key = dateKey(d);
    rows.push(`<span class="day">${i === 0 ? "Aujourd'hui" : cap(shortDate.format(d))}</span>${SLOTS.map((sl) => {
      const its = slotItems(sl.k); if (!its.length) return `<span class="cell muted">–</span>`;
      const marks = its.map((it) => { const f = feedFor(key, it.id); if (f) return av(feeder(f.by), "sm"); const past = i > 0 || slotStatus(sl.k, today).s === "late"; return past ? `<span class="miss" title="Pas noté"></span>` : ""; }).join("");
      return `<span class="cell">${marks || `<span class="muted small">à venir</span>`}</span>`;
    }).join("")}`);
  }
  const since = dateKey(addDays(today, -29)); const counts = Object.fromEntries(fl.map((f) => [f.id, 0])); let tot = 0;
  for (const f of Object.values(state.feeds)) if (f.date >= since && counts[f.by] != null) { counts[f.by]++; tot++; }
  const max = Math.max(1, ...Object.values(counts));
  return `
  <section class="section">
    <div class="section-head"><h2>Qui est de garde</h2><span class="muted small">Touchez une case pour changer · tes gardes sont entourées</span></div>
    <div class="card rota-wrap">${rota}</div>
    <div class="btns"><button class="btn small" data-act="rota-auto">Répartir automatiquement</button></div>
  </section>
  <section class="section">
    <h2>Les 7 derniers jours</h2>
    <div class="card"><div class="hist"><span></span>${SLOTS.map((s) => `<span class="hd">${s.label}</span>`).join("")}${rows.join("")}</div></div>
    <p class="muted small">Cercle pointillé : portion jamais notée. Personne ne l'a donnée, ou quelqu'un a oublié de cocher.</p>
  </section>
  <section class="section">
    <h2>Répartition sur 30 jours</h2>
    <div class="card bars">${tot ? fl.map((f) => `<div class="bar-row"><span class="row">${esc(f.name)}</span><span class="track"><span class="fill" style="--c:${esc(f.color)};width:${(counts[f.id] / max) * 100}%;display:block"></span></span><span class="n tnum">${counts[f.id]} · ${Math.round((counts[f.id] / tot) * 100)} %</span></div>`).join("") : `<p class="empty">Les portions cochées apparaîtront ici, pour voir qui nourrit le plus.</p>`}</div>
  </section>`;
}

/* --- stock --- */

      <div class="btns"><button class="btn small primary" data-act="restock" data-id="${s.id}">J'ai racheté</button><button class="btn small" data-act="stock-edit" data-id="${s.id}">Modifier</button></div>
    </div>`).join("") : `<div class="card empty stack"><span>Ajoute tes croquettes, sachets et soupes. Relie-les ensuite aux repas (Coloc › Repas & horaires) : chaque portion cochée sera décomptée et tu sauras combien de jours il reste.</span><button class="btn primary small" style="align-self:center" data-act="stock-edit">${ICONS.plus}Ajouter un produit</button></div>`}
  </section>
  <section class="section">
    <div class="section-head"><h2>Derniers achats</h2><button class="btn small" data-act="tab" data-k="coloc">Voir les comptes</button></div>

  </section>`;
}

/* --- santé --- */
function renderSante() {
  const entries = ((state.poids && state.poids.entries) || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  const last = entries[entries.length - 1], prev = entries[entries.length - 2];
  const rs = reminders();
  const notes = Object.entries(state.notes).filter(([, n]) => n.kind === "sante").sort((a, b) => b[1].at - a[1].at).slice(0, 10);
  return `
  <section class="section">
    <div class="section-head"><h2>Poids</h2><button class="btn small" data-act="add-weight">${ICONS.plus}Pesée</button></div>
    <div class="card stack">
      ${last ? `<div class="row"><span class="big tnum">${num.format(last.kg)} kg</span>${prev ? `<span class="chip plain">${last.kg - prev.kg >= 0 ? "+" : "−"}${num.format(Math.abs(last.kg - prev.kg))} kg</span>` : ""}<span class="grow"></span><span class="muted small">le ${dayMonth.format(fromKey(last.date))}</span></div>${entries.length > 1 ? spark(entries.slice(-12)) : ""}` : `<p class="empty">Pèse ${esc(state.config.cat.name)} une fois par mois pour suivre son poids.</p>`}
    </div>
  </section>
  <section class="section">
    <div class="section-head"><h2>Rappels</h2><button class="btn small" data-act="add-reminder">${ICONS.plus}Rappel</button></div>
    ${rs.length ? `<div class="card list">${rs.map((r) => `<div class="li"><div class="grow"><div class="t">${esc(r.label)}</div><div class="s">${dayMonth.format(fromKey(r.next))} · tous les ${r.every} j</div></div><span class="chip plain ${r.delta < 0 ? "danger" : r.delta <= 3 ? "warn" : ""}">${r.delta < 0 ? `${-r.delta} j de retard` : r.delta === 0 ? "Aujourd'hui" : `Dans ${r.delta} j`}</span><button class="btn small" data-act="reminder-done" data-id="${r.id}">Fait</button></div>`).join("")}</div>` : `<p class="card empty">Vermifuge, anti-puces, vaccin… Ajoute un rappel et toute la coloc verra l'échéance.</p>`}
  </section>
  <section class="section">
    <div class="section-head"><h2>Journal santé</h2><button class="btn small" data-act="add-note" data-kind="sante">${ICONS.plus}Note</button></div>
    ${notes.length ? `<div class="card list">${notes.map(([, n]) => `<div class="li">${av(feeder(n.by), "sm")}<div class="grow"><div>${esc(n.text)}</div><div class="s">${dayMonth.format(new Date(n.at))} · ${esc((feeder(n.by) || {}).name || "")}</div></div></div>`).join("")}</div>` : `<p class="card empty">Vomi, éternuements, visite chez le véto : note-le pour garder l'historique.</p>`}
  </section>`;
}
function spark(entries) {
  const W = 300, H = 80, P = 10, vals = entries.map((e) => e.kg);
  const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 0.5;
  const x = (i) => P + (i * (W - 2 * P - 34)) / (entries.length - 1), y = (v) => H - P - ((v - min) / span) * (H - 2 * P);
  const pts = entries.map((e, i) => `${x(i)},${y(e.kg)}`).join(" ");
  const lx = x(entries.length - 1), ly = y(vals[vals.length - 1]);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Évolution du poids, de ${num.format(min)} à ${num.format(max)} kg">
    <line class="grid" x1="${P}" x2="${W - P - 34}" y1="${y(min)}" y2="${y(min)}"/><line class="grid" x1="${P}" x2="${W - P - 34}" y1="${y(max)}" y2="${y(max)}"/>
    <polygon class="area" points="${x(0)},${H - P} ${pts} ${lx},${H - P}"/><polyline class="ln" points="${pts}"/>
    <circle class="dot" cx="${lx}" cy="${ly}" r="4.5"/>
    <text x="${W - 30}" y="${y(max) + 4}">${num.format(max)}</text><text x="${W - 30}" y="${y(min) + 4}">${num.format(min)}</text>
  </svg>`;
}

/* --- meals editor (shared by onboarding and settings) --- */
function mealsEditor(slots, ctx) {
  return SLOTS.map((sl) => {
    const s = slots[sl.k] || { time: sl.time, items: [] };
    return `<section class="slot">
      <div class="slot-head"><h2>${sl.label}</h2><span class="spacer"></span><label class="row small muted">Heure <input class="tnum" type="time" id="t-${ctx}-${sl.k}" data-change="slot-time" data-ctx="${ctx}" data-slot="${sl.k}" value="${esc(s.time || sl.time)}" style="background:var(--field-bg);color:var(--field-ink);border:1.5px solid var(--field-border);border-radius:10px;padding:4px 8px"></label></div>
      <div class="items">${(s.items || []).map((it) => `<div class="item" style="cursor:default"><button class="x" data-act="item-del" data-ctx="${ctx}" data-slot="${sl.k}" data-id="${it.id}" aria-label="Retirer">×</button><button data-act="item-edit" data-ctx="${ctx}" data-slot="${sl.k}" data-id="${it.id}" style="all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%"><span class="ty">${esc(TYPES[it.type])}</span>${foodSVG(it.type)}<span class="qty">${esc(it.qty)}</span>${it.stockId && state.stock[it.stockId] ? `<span class="small muted">↧ stock</span>` : ""}</button></div>`).join("")}
        <button class="item add" data-act="item-edit" data-ctx="${ctx}" data-slot="${sl.k}" aria-label="Ajouter un aliment au repas ${sl.label}">+</button></div>
    </section>`;
  }).join("");
}
function renderMealsLive() {

/* ---------- writes ---------- */
const parseNum = (v) => { const n = parseFloat(String(v || "").replace(",", ".").replace(/\s/g, "")); return isFinite(n) ? n : 0; };
function saveConfig(patch) { return Store.set("foyer/config", { ...clone(state.config), ...patch }); }
function savePlan(ctx, slots) { if (ctx === "draft") { state.draft.slots = slots; render(); } else saveConfig({ slots }); }
function feed(slot, id, by) {
  const it = slotItems(slot).find((x) => x.id === id); if (!it) return;
  const key = dateKey();
  Store.set(`feeds/${key}_${id}`, { date: key, itemId: id, slot, by, at: Date.now(), type: it.type, stockId: it.stockId || "", portion: parseNum(it.portion) });
}
function autoRota(fl) {
  const r = {}; if (!fl.length) return r;
  for (let d = 0; d < 7; d++) SLOTS.forEach((sl, i) => { r[`${d}-${sl.k}`] = fl[(d + i) % fl.length].id; });
  return r;
}
function feedNow(slot, ids, by) {
  const key = dateKey(); ids = ids.filter((id) => !feedFor(key, id));
  const items = slotItems(slot).filter((it) => ids.includes(it.id)); if (!items.length) return;
  const left = (k) => slotItems(k).filter((it) => !feedFor(key, it.id) && !ids.includes(it.id)).length;
  const dayDone = SLOTS.every((s) => left(s.k) === 0), slotDone = left(slot) === 0;
  items.forEach((it) => feed(slot, it.id, by));
  const t = items[0].type;
  Sound.play(t === "croquettes" ? "crunch" : t === "friandise" ? "trill" : t === "medicament" ? "tap" : "blop");
  if (dayDone) { Sound.play("purr", 380); Sound.play("meow", 1250); } else if (slotDone) Sound.play("meow", 380);
  try { localStorage.setItem("feedmiou.hint", "1"); } catch (e) {}
  const f = feeder(by);
  toast(by === state.me ? "C'est noté, merci !" : `Noté pour ${f ? f.name : "?"}`, { label: "Annuler", fn: () => { ids.forEach((id) => Store.remove(`feeds/${key}_${id}`)); Sound.play("undo"); } });
}
async function finishFlow() {
  const d = state.draft; if (!d.me) return;
  const feeders = d.feeders.filter((f) => f.name.trim());
  const slots = clone(d.slots);
  await Store.set("foyer/config", { onboarded: true, cat: d.cat, slots, rota: autoRota(feeders), settledAt: 0, createdAt: Date.now() });
  await Promise.all(feeders.map((f, i) => Store.set(`feeders/${f.id}`, { name: f.name.trim(), color: f.color, order: i, theme: f.id === d.me ? d.skin : "velours", uid: f.id === d.me ? (state.myUid || "") : "" })));
  state.me = d.me; try { localStorage.setItem(LS_ME, d.me); } catch (e) {}
  state.draft = null; state.tab = "today"; render(); Sound.play("sparkle"); Sound.play("meow", 320); toast(`Bienvenue chez ${d.cat.name} !`);
}

/* ---------- events ---------- */
const ACT = {
  invite: async () => {
    const url = location.origin + location.pathname + "#code=" + encodeURIComponent(Store.code);
    try {
      if (navigator.share) { await navigator.share({ title: "Feed Miou", text: "Rejoins la coloc de Miou Miou", url }); return; }
      await navigator.clipboard.writeText(url); Sound.play("pop"); toast("Lien copié");
    } catch (e) {
      if (e && e.name === "AbortError") return;
      openSheet(`<h2>Lien d'invitation</h2><p class="sub">Copie-le et envoie-le aux colocs.</p><label class="field"><span>Lien</span><input id="invite-url" readonly value="${esc(url)}"></label>`);
    }
  },
  pet: (ds, el) => { el.classList.remove("wiggle"); void el.offsetWidth; el.classList.add("wiggle"); const r = Math.random(); Sound.play(r < 0.25 ? "purr" : r < 0.55 ? "trill" : "meow"); },
  "toggle-sound": () => { const on = Sound.toggle(); render(); if (on) Sound.play("meow"); toast(on ? "Sons activés" : "Sons coupés"); },
  "dismiss-hint": () => { try { localStorage.setItem("feedmiou.hint", "1"); } catch (e) {} Sound.play("tap"); render(); },
  "qty-preset": (ds) => { const i = $("#it-qty"); if (i) i.value = ds.v; Sound.play("tap"); },
  "change-by": (ds) => { const key = dateKey(), f = feedFor(key, ds.id); closeSheet(); if (!f || f.by === ds.by) return; Store.set(`feeds/${key}_${ds.id}`, { ...clone(f), by: ds.by }); Sound.play("tap"); toast(`Corrigé : donné par ${feeder(ds.by).name}`); },
  "close-sheet": closeSheet,
  tab: (ds) => { Sound.play("tap"); state.tab = ds.k; state.sub = null; closeSheet(); render(); window.scrollTo(0, 0); },
  jump: (ds) => { const el = document.getElementById(`slot-${ds.k}`); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); },
  flow: (ds) => { Sound.play(state.draft.step === 0 ? "meow" : "tap"); state.draft.step = +ds.step; render(); window.scrollTo(0, 0); },
  "draft-feeder-add": () => { const d = state.draft; d.feeders.push({ id: uid(), name: "", color: COLORS[d.feeders.length % COLORS.length] }); render(); const inputs = document.querySelectorAll("[data-input=draft-feeder]"); inputs[inputs.length - 1]?.focus(); },
  "draft-feeder-del": (ds) => { state.draft.feeders.splice(+ds.i, 1); render(); },
  "draft-feeder-color": (ds) => { const f = state.draft.feeders[+ds.i]; f.color = COLORS[(COLORS.indexOf(f.color) + 1) % COLORS.length]; render(); },
  "draft-me": (ds) => { Sound.play("tap"); state.draft.me = ds.id; render(); },
  "draft-skin": (ds) => { Sound.play("sparkle"); state.draft.skin = ds.s; render(); },
  finish: finishFlow,
  "pick-me": (ds) => {
    state.me = ds.id; state.forceWho = false; try { localStorage.setItem(LS_ME, ds.id); } catch (e) {}
    if (state.myUid) for (const [id, f] of Object.entries(state.feeders)) {
      if (id === ds.id && f.uid !== state.myUid) Store.set(`feeders/${id}`, { ...clone(f), uid: state.myUid });
      else if (id !== ds.id && f.uid === state.myUid) Store.set(`feeders/${id}`, { ...clone(f), uid: "" });
    }
    render(); window.scrollTo(0, 0);
  },
  "cancel-who": () => { state.forceWho = false; render(); },
  "switch-me": () => { state.forceWho = true; closeSheet(); render(); window.scrollTo(0, 0); },
  feed: (ds) => feedFor(dateKey(), ds.id) ? doneSheet(ds.slot, ds.id) : feedNow(ds.slot, [ds.id], state.me),
  "do-feed-all": (ds) => { closeSheet(); feedNow(ds.slot, slotItems(ds.slot).map((x) => x.id), state.me); },
  unfeed: (ds) => { Store.remove(`feeds/${dateKey()}_${ds.id}`); closeSheet(); Sound.play("undo"); toast("Distribution annulée"); },
  "add-note": (ds) => noteSheet(ds.kind),
  "del-note": (ds) => { const p = `notes/${ds.id}`, prev = clone(state.notes[ds.id]); Store.remove(p); Sound.play("undo"); toast("Note supprimée", { label: "Annuler", fn: () => { if (prev) Store.set(p, prev); Sound.play("pop"); } }); },
  rota: (ds) => rotaSheet(ds.cell),
  "set-rota": (ds) => { saveConfig({ rota: { ...(state.config.rota || {}), [ds.cell]: ds.id } }); closeSheet(); },
  "rota-auto": () => { saveConfig({ rota: autoRota(feederList()) }); toast("Garde répartie à tour de rôle"); },
  "stock-edit": (ds) => stockSheet(ds.id),
  "stock-del": (ds) => { const p = `stock/${ds.id}`, prev = clone(state.stock[ds.id]); Store.remove(p); closeSheet(); Sound.play("undo"); toast("Produit supprimé", { label: "Annuler", fn: () => { if (prev) Store.set(p, prev); Sound.play("pop"); } }); },
  restock: (ds) => restockSheet(ds.id),
  "add-expense": expenseSheet,
  "del-expense": (ds) => { const p = `achats/${ds.id}`, prev = clone(state.achats[ds.id]); Store.remove(p); Sound.play("undo"); toast("Dépense supprimée", { label: "Annuler", fn: () => { if (prev) Store.set(p, prev); Sound.play("pop"); } }); },
  settle: () => { saveConfig({ settledAt: Date.now() }); toast("Comptes remis à zéro"); },
  "feeder-edit": (ds) => feederSheet(ds.id),
  "feeder-del": (ds) => { Store.remove(`feeders/${ds.id}`); closeSheet(); },
  "set-skin": (ds) => { const m = state.feeders[state.me]; if (m) { Sound.play("sparkle"); Store.set(`feeders/${state.me}`, { ...clone(m), theme: ds.s }); } },
  "edit-cat": catSheet,
  "open-meals": () => { state.sub = "meals"; render(); window.scrollTo(0, 0); },
  "close-meals": () => { state.sub = null; render(); },
  "item-edit": (ds) => itemSheet(ds.ctx, ds.slot, ds.id),
  "item-del": (ds) => { const slots = clone(ds.ctx === "draft" ? state.draft.slots : slotsOf(state.config)); slots[ds.slot].items = slots[ds.slot].items.filter((x) => x.id !== ds.id); savePlan(ds.ctx, slots); },
  "add-weight": weightSheet,
  "add-reminder": reminderSheet,
  preset: (ds) => { $("#r-label").value = ds.label; $("#r-every").value = ds.days; },
  "reminder-done": (ds) => { const items = clone((state.rappels && state.rappels.items) || []); const r = items.find((x) => x.id === ds.id); if (!r) return; r.next = dateKey(addDays(new Date(), Number(r.every) || 30)); Store.set("sante/rappels", { items }); Sound.play("sparkle"); toast(`${r.label} : prochain le ${dayMonth.format(fromKey(r.next))}`); }
};

const FORMS = {
  code: async (fd, form) => {
    const btn = form.querySelector("button[type=submit]"); if (btn) btn.disabled = true;
    const ok = await tryCode(String(fd.get("code") || ""));
    if (ok) { state.needCode = false; state.codeDraft = null; Sound.play("meow"); startWatches(); Store.refresh(); }
    render();
  },
  "flow-cat": (fd) => { const d = state.draft; d.cat = { name: fd.get("name").trim(), breed: fd.get("breed").trim(), age: fd.get("age").trim(), coat: fd.get("coat") || "siamois", sex: fd.get("sex") || "" }; d.step = 3; render(); window.scrollTo(0, 0); },
  "cat-live": (fd) => { saveConfig({ cat: { name: fd.get("name").trim(), breed: fd.get("breed").trim(), age: fd.get("age").trim(), coat: fd.get("coat") || "siamois", sex: fd.get("sex") || "", avatar: fd.get("avatar") || "photo" } }); closeSheet(); Sound.play("meow"); toast("Profil enregistré"); },
  item: (fd, form) => {
    const { ctx, slot, id } = form.dataset;
    const slots = clone(ctx === "draft" ? state.draft.slots : slotsOf(state.config));
    slots[slot] = slots[slot] || { time: SLOTS.find((s) => s.k === slot).time, items: [] };
    const it = { id: id || uid(), type: fd.get("type") || "croquettes", qty: fd.get("qty").trim(), brand: (fd.get("brand") || "").trim(), time: fd.get("time") || "", stockId: fd.get("stockId") || "", portion: fd.get("portion") ? String(parseNum(fd.get("portion"))) : "" };
    const i = slots[slot].items.findIndex((x) => x.id === it.id);
    if (i >= 0) slots[slot].items[i] = it; else slots[slot].items.push(it);
    savePlan(ctx, slots); closeSheet(); Sound.play("pop");
  },
  note: (fd, form) => { const kind = form.dataset.kind === "sante" || fd.get("sante") ? "sante" : "note"; Store.set(`notes/${uid()}`, { date: dateKey(), at: Date.now(), by: state.me, text: fd.get("text").trim(), kind }); closeSheet(); Sound.play("blop"); toast("Note partagée"); },
  stock: (fd, form) => { const id = form.dataset.id || uid(); Store.set(`stock/${id}`, { name: fd.get("name").trim(), type: fd.get("type") || "croquettes", unit: fd.get("unit"), qty: parseNum(fd.get("qty")), restockAt: Date.now(), alertDays: parseNum(fd.get("alertDays")) || 5 }); closeSheet(); Sound.play("crunch"); toast("Stock enregistré"); },
  restock: (fd, form) => {
    const id = form.dataset.id, s = stockInfo(id); const add = parseNum(fd.get("qty")), price = parseNum(fd.get("price"));
    const { remaining, perDay, daysLeft, level, start, ...raw } = s; delete raw.id;
    Store.set(`stock/${id}`, { ...raw, qty: remaining + add, restockAt: Date.now() });
    if (price > 0) Store.set(`achats/${uid()}`, { by: fd.get("by"), at: Date.now(), label: `${s.name} (+${num.format(add)} ${s.unit})`, amount: price, stockId: id });
    closeSheet(); Sound.play(price > 0 ? "coin" : "crunch"); toast(price > 0 ? "Stock et dépense ajoutés" : "Stock mis à jour");
  },
  expense: (fd) => { Store.set(`achats/${uid()}`, { by: fd.get("by"), at: Date.now(), label: fd.get("label").trim(), amount: parseNum(fd.get("amount")) }); closeSheet(); Sound.play("coin"); toast("Dépense ajoutée"); },
  feeder: (fd, form) => { const id = form.dataset.id || uid(); const prev = state.feeders[id] || { theme: "velours", uid: "", order: feederList().length }; Store.set(`feeders/${id}`, { ...clone(prev), name: fd.get("name").trim(), color: fd.get("color") || prev.color || COLORS[0] }); closeSheet(); },
  weight: (fd) => { const entries = clone((state.poids && state.poids.entries) || []).filter((e) => e.date !== fd.get("date")); entries.push({ date: fd.get("date"), kg: parseNum(fd.get("kg")), by: state.me }); entries.sort((a, b) => a.date.localeCompare(b.date)); Store.set("sante/poids", { entries: entries.slice(-120) }); closeSheet(); Sound.play("pop"); toast("Pesée enregistrée"); },
  reminder: (fd) => { const items = clone((state.rappels && state.rappels.items) || []); items.push({ id: uid(), label: fd.get("label").trim(), next: fd.get("next"), every: parseNum(fd.get("every")) || 30 }); Store.set("sante/rappels", { items }); closeSheet(); Sound.play("sparkle"); toast("Rappel ajouté"); }
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener("submit", (e) => { const f = e.target.closest("form[data-form]"); if (!f) return; e.preventDefault(); FORMS[f.dataset.form]?.(new FormData(f), f); });
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "coloc-code") state.codeDraft = el.value;
  if (el.dataset.input === "draft-feeder") state.draft.feeders[+el.dataset.i].name = el.value;
  if (el.closest("form[data-form=flow-cat]") && state.draft) { const fd = new FormData(el.form); Object.assign(state.draft.cat, { name: fd.get("name"), breed: fd.get("breed"), age: fd.get("age"), coat: fd.get("coat") || state.draft.cat.coat, sex: fd.get("sex") || state.draft.cat.sex }); }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.change === "slot-time") { const ctx = el.dataset.ctx; const slots = clone(ctx === "draft" ? state.draft.slots : slotsOf(state.config)); slots[el.dataset.slot] = slots[el.dataset.slot] || { items: [] }; slots[el.dataset.slot].time = el.value; savePlan(ctx, slots); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#sheet-root").innerHTML) closeSheet(); });

/* ---------- boot ---------- */
let watching = false;
function startWatches() {
  if (watching) return; watching = true;
  const since = dateKey(addDays(new Date(), -90));
  Store.watchDoc("foyer/config", (d) => { state.config = d; state.configLoaded = true; render(); });
  Store.watchCol("feeders", (o) => { state.feeders = o; render(); });
  Store.watchCol("feeds", (o) => { state.feeds = o; render(); }, ["date", ">=", since]);
  Store.watchCol("notes", (o) => { state.notes = o; render(); }, ["date", ">=", dateKey(addDays(new Date(), -120))]);
  Store.watchCol("stock", (o) => { state.stock = o; render(); });
  Store.watchCol("achats", (o) => { state.achats = o; render(); });
  Store.watchDoc("sante/poids", (d) => { state.poids = d; render(); });
  Store.watchDoc("sante/rappels", (d) => { state.rappels = d; render(); });
  render();
  setInterval(() => { if (state.config && state.config.onboarded && state.me && !document.activeElement?.matches("input,select,textarea")) render(); }, 60000);
}
async function tryCode(c) {
  state.codeErr = "";
  try {
    const ok = await Store.connect(c.trim());
    if (!ok) state.codeErr = "Ce code ne marche pas. Vérifie le lien d'invitation.";
    return ok;
  } catch (e) {
    state.codeErr = "Impossible de joindre la base. Vérifie ta connexion puis réessaie.";
    return false;
  }
}
async function boot() {
  await Store.init();
  state.ready = true;
  if (Store.mode === "sb") {
    const fromHash = new URLSearchParams(location.hash.slice(1)).get("code");
    if (fromHash) history.replaceState(null, "", location.pathname + location.search);
    const c = fromHash || Store.savedCode();
    if (!c) { state.needCode = true; render(); return; }
    if (Store.hasCache() && !fromHash) startWatches();
    const ok = await tryCode(c);
    if (ok) { startWatches(); Store.refresh(); return; }
    if (state.codeErr.startsWith("Ce code") || !state.configLoaded) { state.needCode = true; state.codeDraft = c; render(); }
    else toast("Pas de connexion : dernières données connues affichées.");
    return;
  }
  if (window.claude && typeof window.claude.use === "function") {
    try { const user = await window.claude.use("user"); if (user) state.myUid = await user.id(); } catch (e) {}
  }
  startWatches();
}
boot();
})();
</script>
<script>
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
